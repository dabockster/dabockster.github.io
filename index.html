<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Specifies character encoding -->
        <meta charset="UTF-8">
        <!-- Ensures proper scaling on mobile devices -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Title of the webpage -->
        <title>Two Column Layout</title>
        <!-- Stylesheet for styling the page -->
        <link rel="stylesheet" href="style.css">

    </head>

    <body>
        <!-- Main container holding both columns -->
        <div class="container">
            <!-- Left section of the layout -->
            <div class="left-column">
                <div class="left-content">
                    <h2>Left Column</h2>
                    <p>This column takes up 20% of the page width.</p>
                </div>
            </div>
            <!-- Right section of the layout -->
            <div class="right-column">
                <div class="right-content">
                    <h2>Right Column</h2>
                    <p>This column takes up 80% of the page width.</p>
                </div>
            </div>
        </div>
    </body>
</html>
